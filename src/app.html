<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			(() => {
				try {
					const stored = localStorage.getItem('theme-preference');
					const preference = ['light', 'dark', 'system'].includes(stored) ? stored : 'system';
					const resolved =
						preference === 'system'
							? matchMedia('(prefers-color-scheme: dark)').matches
								? 'dark'
								: 'light'
							: preference;
					document.documentElement.classList.add(resolved);
					document.documentElement.dataset.theme = preference;
					document.documentElement.style.colorScheme = resolved;
				} catch {
					document.documentElement.classList.add('dark');
				}
			})();
		</script>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap"
			rel="stylesheet"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
